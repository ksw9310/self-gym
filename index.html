<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GymBack</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0A0A0A; --card: #161616; --card2: #1E1E1E; --border: #2A2A2A;
  --primary: #C8FF00; --primary-dim: rgba(200,255,0,0.12);
  --text: #F0F0F0; --muted: #666;
  --green: #4ADE80; --orange: #FB923C; --red: #F87171;
}
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100dvh; max-width: 480px; margin: 0 auto;
  overflow-x: hidden;
}
.screen { display: none; min-height: 100dvh; padding-bottom: 80px; }
.screen.active { display: block; }

/* Header */
.hdr {
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg); z-index: 10;
  border-bottom: 1px solid var(--border);
}
.hdr-title { font-size: 18px; font-weight: 700; }
.hdr-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Cards */
.card {
  background: var(--card); border-radius: 16px; padding: 18px 16px;
  margin: 0 14px 10px; border: 1px solid var(--border);
}

/* Buttons */
.btn {
  width: 100%; padding: 16px; border-radius: 14px; border: none;
  font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
}
.btn:active { opacity: 0.75; }
.btn-primary { background: var(--primary); color: #0A0A0A; }
.btn-ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.25); }
.btn-back { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 0 12px 0 0; line-height: 1; }

/* Bottom Nav */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(22,22,22,0.95); backdrop-filter: blur(10px);
  border-top: 1px solid var(--border); display: flex; z-index: 100;
}
.nav-btn {
  flex: 1; padding: 10px 0 20px; border: none; background: none; color: var(--muted);
  font-size: 11px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 3px; transition: color 0.15s;
}
.nav-btn.active { color: var(--primary); }
.nav-icon { font-size: 22px; }

/* Input */
.inp {
  width: 100%; background: var(--card2); border: 1px solid var(--border);
  border-radius: 12px; padding: 13px 14px; color: var(--text);
  font-size: 16px; -webkit-appearance: none;
}
.inp:focus { outline: none; border-color: var(--primary); }
.inp-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

/* Section title */
.sec { font-size: 12px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; padding: 18px 18px 8px; }

/* Phase badge */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 20px; font-size: 12px; font-weight: 700;
}

/* Progress bar */
.prog { height: 3px; background: var(--card2); border-radius: 2px; margin: 0 14px 14px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.3s; }

/* Set row */
.set-row {
  display: grid; grid-template-columns: 26px 1fr 20px 1fr 34px;
  align-items: center; gap: 8px; padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.set-row:last-of-type { border-bottom: none; }
.set-num {
  width: 26px; height: 26px; border-radius: 7px; background: var(--card2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.set-row.done .set-num { background: var(--primary-dim); color: var(--primary); }
.set-inp {
  background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 6px; color: var(--text); font-size: 15px; font-weight: 600;
  text-align: center; width: 100%; -webkit-appearance: none;
}
.set-inp:focus { outline: none; border-color: var(--primary); }
.set-inp:disabled { opacity: 0.5; }
.set-x { color: var(--muted); font-size: 14px; text-align: center; }
.set-check {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border);
  background: none; cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: all 0.15s; font-size: 14px;
}
.set-check.on { background: var(--primary); border-color: var(--primary); color: #0A0A0A; }

/* History row */
.hist-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.hist-icon {
  width: 44px; height: 44px; border-radius: 12px; background: var(--card2);
  display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}

/* Tip */
.tip {
  background: var(--primary-dim); border: 1px solid rgba(200,255,0,0.15);
  border-radius: 10px; padding: 9px 12px; font-size: 12px; color: var(--primary); margin-top: 8px;
}

/* Prev record */
.prev { font-size: 11px; color: var(--muted); margin-top: 5px; }

/* Stat grid */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 14px 12px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; text-align: center;
}
.stat-val { font-size: 26px; font-weight: 800; color: var(--primary); }
.stat-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* Misc */
.center { display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60vh; text-align: center; padding: 30px 20px; }
.emoji-lg { font-size: 60px; margin-bottom: 16px; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="s-setup" class="screen active">
  <div style="padding:50px 20px 20px;text-align:center">
    <div style="font-size:52px;margin-bottom:14px">🏋️</div>
    <div style="font-size:26px;font-weight:800;letter-spacing:-0.5px">GymBack</div>
    <div style="font-size:14px;color:var(--muted);margin-top:8px;line-height:1.6">
      6개월 공백 후 스마트하게 복귀하는<br>개인 트레이닝 플래너
    </div>
  </div>
  <div id="setup-body"></div>
</div>

<!-- TODAY -->
<div id="s-today" class="screen">
  <div class="hdr">
    <div>
      <div class="hdr-title">오늘의 운동</div>
      <div class="hdr-sub" id="today-date"></div>
    </div>
    <div id="today-phase"></div>
  </div>
  <div id="today-body"></div>
</div>

<!-- WORKOUT -->
<div id="s-workout" class="screen">
  <div class="hdr">
    <button class="btn-back" onclick="backFromWorkout()">←</button>
    <div style="flex:1">
      <div class="hdr-title" id="wo-title"></div>
      <div class="hdr-sub" id="wo-prog-txt"></div>
    </div>
    <div id="wo-timer" style="font-size:15px;font-weight:700;color:var(--primary)">0:00</div>
  </div>
  <div class="prog"><div class="prog-fill" id="wo-prog-bar" style="width:0%"></div></div>
  <div id="wo-body"></div>
</div>

<!-- HISTORY -->
<div id="s-history" class="screen">
  <div class="hdr"><div class="hdr-title">운동 기록</div></div>
  <div id="hist-body"></div>
</div>

<!-- SETTINGS -->
<div id="s-settings" class="screen">
  <div class="hdr"><div class="hdr-title">설정</div></div>
  <div id="set-body"></div>
</div>

<!-- NAV -->
<nav class="nav" id="main-nav" style="display:none">
  <button class="nav-btn active" id="nav-today" onclick="go('today')">
    <span class="nav-icon">🏠</span><span>오늘</span>
  </button>
  <button class="nav-btn" id="nav-history" onclick="go('history')">
    <span class="nav-icon">📊</span><span>기록</span>
  </button>
  <button class="nav-btn" id="nav-settings" onclick="go('settings')">
    <span class="nav-icon">⚙️</span><span>설정</span>
  </button>
</nav>

<script>

        {id:'wall_sit',    name:'월 싯 홀드',      tip:'허벅지 수평, 30~60초 버티기'},

// 히스토리 조회용 전체 운동 ID → 정보 맵
const ALL_EX = {};
Object.values(WO).forEach(wo => {
  wo.ex.forEach(slot => {
    if (slot.pool) slot.pool.forEach(ex => { ALL_EX[ex.id] = ex; });
    else ALL_EX[slot.id] = slot;
  });
});

const SCHED = ['upperA','lowerA','rest','upperB','lowerB','rest','rest'];

// sets per exercise per phase [phase][workoutId][exIdx]
const SETS = {
  1: {upperA:[3,2,2,2,2], lowerA:[3,2,2,2,3], upperB:[3,2,2,2,2], lowerB:[3,2,2,3]},
  2: {upperA:[4,3,3,3,3], lowerA:[4,3,3,3,3], upperB:[4,3,3,3,3], lowerB:[4,3,3,3]},

function settingsFromRow(r) {

    sessionCounts: r.session_counts || {}

  return (rows || []).map(r => ({

    phase: r.phase,
    timerSec: r.timer_sec || 0,

async function load() {
  try {
    const [sRes, hRes] = await Promise.all([
      sb.from('settings').select('*').eq('id','default').maybeSingle(),
      sb.from('history').select('*').order('id', {ascending:true})
    ]);
    if (sRes.error && sRes.error.code !== 'PGRST116') throw sRes.error;
    if (hRes.error) throw hRes.error;

    if (sRes.data) {
      ST.settings = settingsFromRow(sRes.data);
      ST.history = historyFromRows(hRes.data);
    } else {
      ST.settings = null;
      ST.history = [];
      await migrateFromLS();
    }
  } catch (e) {
    console.error('Supabase load failed, falling back to localStorage:', e);
    try {
      const s = localStorage.getItem('gb_s');
      const h = localStorage.getItem('gb_h');
      ST.settings = s ? JSON.parse(s) : null;
      ST.history  = h ? JSON.parse(h) : [];
    } catch(_) { ST.settings = null; ST.history = []; }
  }
}

async function migrateFromLS() {
  const sRaw = localStorage.getItem('gb_s');
  if (!sRaw) return;
  try {
    const s = JSON.parse(sRaw);
    ST.settings = {
      startDate: s.startDate,
      prevWeights: s.prevWeights || {},
      manualPhase: s.manualPhase || null,
      sessionCounts: s.sessionCounts || {}
    };
    await saveST();

    const hRaw = localStorage.getItem('gb_h');
    if (hRaw) {
      const h = JSON.parse(hRaw);
      if (h.length) {
        await sb.from('history').upsert(h.map(r => ({
          id: r.id,
          date: r.date,
          workout_id: r.workoutId,
          phase: r.phase,
          timer_sec: r.timerSec || 0,
          exercises: r.exercises
        })));
        ST.history = h.map(r => ({...r}));
      }
    }
    localStorage.removeItem('gb_s');
    localStorage.removeItem('gb_h');
  } catch (e) {
    console.error('Migration failed:', e);
  }
}

async function saveST() {
  if (!ST.settings) return;
  try {
    const { error } = await sb.from('settings').upsert({

      start_date: ST.settings.startDate,
      prev_weights: ST.settings.prevWeights || {},
      manual_phase: ST.settings.manualPhase,
      session_counts: ST.settings.sessionCounts || {},

// ─── UTIL ─────────────────────────────────────────────────────────
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
function p2(n) { return String(n).padStart(2,'0'); }

function daysSince(dateStr) {
  const s = new Date(dateStr); const t = new Date(today());
  const sd = new Date(s.getFullYear(), s.getMonth(), s.getDate());
  const td = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.floor((td - sd) / 86400000);
}

function getPhase() {
  if (!ST.settings) return 1;
  if (ST.settings.manualPhase) return ST.settings.manualPhase;
  const w = Math.floor(daysSince(ST.settings.startDate) / 7) + 1;
  return w <= 2 ? 1 : w <= 4 ? 2 : 3;
}

function getTodayWo() {
  if (!ST.settings) return null;
  const d = daysSince(ST.settings.startDate);
  return SCHED[((d % 7) + 7) % 7];
}

function getWeek() { return Math.floor(daysSince(ST.settings.startDate) / 7) + 1; }

function fmtDate(s) {
  const d = new Date(s);
  return `${d.getMonth()+1}월 ${d.getDate()}일`;
}

function fmtTime(sec) {
  return `${Math.floor(sec/60)}:${p2(sec%60)}`;
}

function recWeight(exId, phase) {
  const prev = ST.settings?.prevWeights?.[exId];
  if (prev) return Math.round(prev * PHASE[phase].pct / 2.5) * 2.5;
  const rel = EX_BASE[exId];
  if (!rel?.ratio) return null;
  const basePrev = ST.settings?.prevWeights?.[rel.base];
  if (!basePrev) return null;
  return Math.round(basePrev * rel.ratio * PHASE[phase].pct / 2.5) * 2.5;
}

function recWeightLabel(exId, phase) {
  const rw = recWeight(exId, phase);
  if (!rw) return null;
  if (ST.settings?.prevWeights?.[exId]) {
    return `추천 ${rw}kg (이전의 ${Math.round(PHASE[phase].pct*100)}%)`;
  }
  const rel = EX_BASE[exId];
  const baseName = MAIN_LIFTS.find(m => m.id === rel?.base)?.name || rel?.base;
  return `추천 ${rw}kg (${baseName} 기준)`;
}

// 세션 카운트 기반으로 pool 슬롯을 실제 운동으로 해석
function getWorkoutExercises(woId) {
  const cnt = ST.settings?.sessionCounts?.[woId] || 0;
  return WO[woId].ex.map(slot => slot.pool ? slot.pool[cnt % slot.pool.length] : slot);
}

function lastRecord(woId) {
  for (let i = ST.history.length-1; i >= 0; i--)
    if (ST.history[i].workoutId === woId) return ST.history[i];
  return null;
}

function fmtSets(arr) {
  if (!arr?.length) return '';
  const done = arr.filter(s => s.done);
  return done.length ? done.map(s=>`${s.w}×${s.r}`).join(' / ') : '';
}

function totalVol(record) {
  return Object.values(record.exercises)
    .reduce((a, sets) => a + sets.filter(s=>s.done).reduce((b,s)=>b+s.w*s.r,0), 0);
}

function doneSetsCount(record) {
  return Object.values(record.exercises).reduce((a,sets)=>a+sets.filter(s=>s.done).length,0);
}

    if (SCHED[idx] !== 'rest') {
      const w = WO[SCHED[idx]];
      return `${w.icon} ${w.name} (${i===1?'내일':i+'일 후'})`;
    }
  }
  return '';
}

// ─── WORKOUT SESSION ─────────────────────────────────────────────
function startWo(woId) {
  const phase = getPhase();
  const wo = WO[woId];
  const last = lastRecord(woId);

  ST.active = {
    woId, phase,
    exercises: getWorkoutExercises(woId).map((ex, i) => {
      const sc = (SETS[phase][woId] || [])[i] || 3;
      const rw = recWeight(ex.id, phase) || '';
      const prevSets = last?.exercises?.[ex.id] || [];
      return {
        ...ex,
        sets: Array.from({length: sc}, (_, si) => ({
          w: prevSets[si]?.w || rw || '',
          r: prevSets[si]?.r || PHASE[phase].reps.split('~')[0] || '',
          done: false
        })),
        prevSets
      };
    })
  };

  ST.timerSec = 0;
  if (ST.timer) clearInterval(ST.timer);
  ST.timer = setInterval(() => {
    ST.timerSec++;
    const el = document.getElementById('wo-timer');
    if (el) el.textContent = fmtTime(ST.timerSec);
  }, 1000);

  renderWo();
  showScr('workout');
}

function renderWo() {
  const aw = ST.active;
  if (!aw) return;
  const wo = WO[aw.woId];

  document.getElementById('wo-title').textContent = `${wo.icon} ${wo.name}`;

  const done = aw.exercises.reduce((a,ex) => a+ex.sets.filter(s=>s.done).length, 0);
  const total = aw.exercises.reduce((a,ex) => a+ex.sets.length, 0);
  document.getElementById('wo-prog-txt').textContent = `${done} / ${total} 세트 완료`;
  document.getElementById('wo-prog-bar').style.width = total ? `${done/total*100}%` : '0%';

  let html = '';
  aw.exercises.forEach((ex, ei) => {
    const allDone = ex.sets.every(s => s.done);
    html += `
      <div class="card" style="${allDone?'opacity:0.65;':''}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div>
            <span style="font-weight:700;font-size:15px">${ex.name}</span>
            ${ex.note ? `<span style="font-size:11px;color:var(--muted);margin-left:4px">(${ex.note})</span>` : ''}
          </div>
          ${allDone ? '<span style="color:var(--green);font-size:18px">✓</span>' : ''}
        </div>
        <div style="display:grid;grid-template-columns:26px 1fr 20px 1fr 34px;gap:8px;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--border)">
          <span></span>
          <span style="text-align:center;font-size:10px;color:var(--muted)">무게 (kg)</span>
          <span></span>
          <span style="text-align:center;font-size:10px;color:var(--muted)">횟수</span>
          <span></span>
        </div>`;

    ex.sets.forEach((set, si) => {
      const prev = ex.prevSets?.[si];
      html += `
        <div class="set-row${set.done?' done':''}" id="sr-${ei}-${si}">
          <div class="set-num">${si+1}</div>
          <input class="set-inp" type="number" min="0" step="0.5"
            value="${set.w}" placeholder="${prev?.w||''}"
            oninput="upd(${ei},${si},'w',this.value)"
            ${set.done?'disabled':''}>
          <span class="set-x">×</span>
          <input class="set-inp" type="number" min="0" step="1"
            value="${set.r}" placeholder="${prev?.r||''}"
            oninput="upd(${ei},${si},'r',this.value)"
            ${set.done?'disabled':''}>
          <button class="set-check${set.done?' on':''}" onclick="toggleSet(${ei},${si})">
            ${set.done?'✓':''}
          </button>
        </div>`;
    });

    const prevStr = fmtSets(ex.prevSets);
    if (prevStr) html += `<div class="prev">지난 기록: ${prevStr}</div>`;
    html += `<div class="tip">💡 ${ex.tip}</div></div>`;
  });

  const allDone = aw.exercises.every(ex => ex.sets.every(s => s.done));
  html += `
    <div style="margin:14px">
      <button class="btn ${allDone?'btn-primary':'btn-ghost'}" onclick="finishWo()">
        ${allDone ? '🎉 운동 완료!' : '종료 및 기록 저장'}
      </button>
    </div>`;

  document.getElementById('wo-body').innerHTML = html;
}

function upd(ei, si, field, val) {
  if (ST.active) ST.active.exercises[ei].sets[si][field] = field==='w' ? parseFloat(val)||'' : parseInt(val)||'';
}

function toggleSet(ei, si) {
  const set = ST.active.exercises[ei].sets[si];
  if (!set.done) {
    if (!set.w && !set.r) { alert('무게와 횟수를 입력해주세요'); return; }
    // save current input values from DOM before toggling
    const wInp = document.querySelector(`#sr-${ei}-${si} .set-inp:first-of-type`);
    const rInp = document.querySelector(`#sr-${ei}-${si} .set-inp:last-of-type`);
    if (wInp) set.w = parseFloat(wInp.value)||set.w;
    if (rInp) set.r = parseInt(rInp.value)||set.r;
  }
  set.done = !set.done;
  renderWo();
}

function backFromWorkout() {
  if (!confirm('운동을 중단할까요? 기록은 저장되지 않습니다.')) return;
  if (ST.timer) { clearInterval(ST.timer); ST.timer = null; }
  ST.active = null;
  go('today');
}

function finishWo() {
  const aw = ST.active;
  const done = aw.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
  if (done === 0) { alert('최소 1세트 이상 완료해야 저장할 수 있어요'); return; }
  if (ST.timer) { clearInterval(ST.timer); ST.timer = null; }

  const record = {
    id: Date.now(), date: today(), workoutId: aw.woId,
    phase: aw.phase, timerSec: ST.timerSec, exercises: {}
  };
  aw.exercises.forEach(ex => {
    record.exercises[ex.id] = ex.sets.map(s => ({w:parseFloat(s.w)||0, r:parseInt(s.r)||0, done:s.done}));
  });

  ST.history.push(record);
  if (!ST.settings.sessionCounts) ST.settings.sessionCounts = {};
  ST.settings.sessionCounts[aw.woId] = (ST.settings.sessionCounts[aw.woId] || 0) + 1;
  addH(record);
  saveST();
  ST.active = null;
  showComplete(record);
}

function showComplete(rec) {
  const wo = WO[rec.workoutId];
  const ds = doneSetsCount(rec);
  const vol = Math.round(totalVol(rec));

  document.getElementById('today-body').innerHTML = `
    <div class="center" style="min-height:80vh">
      <div class="emoji-lg">🎉</div>
      <div style="font-size:26px;font-weight:800;margin-bottom:6px">운동 완료!</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:28px">${wo.icon} ${wo.name}</div>
      <div class="stat-grid" style="width:100%">
        <div class="stat-card">
          <div class="stat-val">${fmtTime(rec.timerSec)}</div>
          <div class="stat-lbl">운동 시간</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${ds}</div>
          <div class="stat-lbl">완료 세트</div>
        </div>
        <div class="stat-card" style="grid-column:1/-1">
          <div class="stat-val">${vol.toLocaleString()}</div>
          <div class="stat-lbl">총 볼륨 (kg)</div>
        </div>
      </div>
      <div style="margin-top:20px;width:100%;max-width:280px">
        <button class="btn btn-primary" onclick="go('today')">홈으로 돌아가기</button>
      </div>
    </div>`;
  showScr('today');
  document.getElementById('main-nav').style.display = 'flex';
}

// ─── HISTORY ─────────────────────────────────────────────────────
function renderHistory() {
  const b = document.getElementById('hist-body');
  if (!ST.history.length) {
    b.innerHTML = `
      <div class="center">
        <div class="emoji-lg">📋</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">아직 기록이 없어요</div>
        <div style="font-size:13px;color:var(--muted)">운동을 완료하면 여기에 쌓여요</div>
      </div>`;
    return;
  }

  const sorted = [...ST.history].reverse();
  let html = '';
  let lastDate = '';

  sorted.forEach(rec => {
    const wo = WO[rec.workoutId];
    if (rec.date !== lastDate) {
      html += `<div class="sec">${fmtDate(rec.date)}</div>`;
      lastDate = rec.date;
    }
    const ds = doneSetsCount(rec);
    const vol = Math.round(totalVol(rec));
    html += `
      <div class="hist-row" onclick="showHistDetail(${rec.id})">
        <div class="hist-icon">${wo?.icon||'🏋️'}</div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:14px">${wo?.name||rec.workoutId}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">
            ${ds}세트 · ${vol.toLocaleString()}kg · ${fmtTime(rec.timerSec||0)}
          </div>
        </div>
        <span style="color:var(--muted);font-size:18px">›</span>
      </div>`;
  });

  b.innerHTML = html;
}

function showHistDetail(id) {
  const rec = ST.history.find(h => h.id === id);
  if (!rec) return;
  const wo = WO[rec.workoutId];

  let html = `
    <div class="hdr" style="position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)">
      <button class="btn-back" onclick="go('history')">←</button>
      <div style="flex:1">
        <div class="hdr-title">${wo?.icon} ${wo?.name}</div>
        <div class="hdr-sub">${fmtDate(rec.date)} · ${fmtTime(rec.timerSec||0)}</div>
      </div>
    </div>`;

  const ds = doneSetsCount(rec); const vol = Math.round(totalVol(rec));
  html += `
    <div class="stat-grid" style="margin-top:14px">
      <div class="stat-card"><div class="stat-val">${ds}</div><div class="stat-lbl">완료 세트</div></div>
      <div class="stat-card"><div class="stat-val">${vol.toLocaleString()}</div><div class="stat-lbl">총 볼륨(kg)</div></div>
    </div>`;

  Object.keys(rec.exercises).forEach(exId => {
    const ex = ALL_EX[exId] || {name: exId, note: null};
    const sets = rec.exercises[exId].filter(s => s.done);
    if (!sets.length) return;
    html += `
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px">${ex.name}${ex.note?` <span style="font-size:11px;color:var(--muted);font-weight:400">(${ex.note})</span>`:''}</div>
        ${sets.map((s,i) => `
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="color:var(--muted);font-size:13px">세트 ${i+1}</span>
            <span style="font-weight:600">${s.w}kg × ${s.r}회</span>
            <span style="color:var(--muted);font-size:12px">${Math.round(s.w*s.r)}kg</span>
          </div>`).join('')}
      </div>`;
  });

  document.getElementById('hist-body').innerHTML = html;
}

// ─── SETTINGS ────────────────────────────────────────────────────
function renderSettings() {
  const phase = getPhase();
  const pi = PHASE[phase];
  const wk = getWeek();

  document.getElementById('set-body').innerHTML = `
    <div class="sec">현재 상태</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="color:var(--muted);font-size:14px">시작일</span>
        <span style="font-weight:600">${fmtDate(ST.settings.startDate)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="color:var(--muted);font-size:14px">진행 주차</span>
        <span style="font-weight:600">${wk}주차 (${daysSince(ST.settings.startDate)+1}일차)</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:var(--muted);font-size:14px">현재 페이즈</span>
        <span class="badge" style="background:${pi.col}20;color:${pi.col}">P${phase} ${pi.name}</span>
      </div>
    </div>

    <div class="sec">페이즈 수동 변경</div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">자동 계산 대신 직접 페이즈를 설정할 수 있어요</div>
      <div style="display:flex;gap:8px">
        ${[1,2,3].map(p => `
          <button onclick="setPhase(${p})" style="flex:1;padding:12px 6px;border-radius:10px;
            border:2px solid ${phase===p?PHASE[p].col:'var(--border)'};
            background:${phase===p?PHASE[p].col+'18':'transparent'};
            color:${phase===p?PHASE[p].col:'var(--muted)'};
            font-weight:700;cursor:pointer;font-size:13px;line-height:1.5">
            P${p}<br><span style="font-size:11px;font-weight:400">${PHASE[p].name}</span>
          </button>`).join('')}
      </div>
      ${ST.settings.manualPhase ? `
        <button onclick="setPhase(null)" style="margin-top:10px;width:100%;padding:10px;border-radius:10px;
          border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:13px">
          자동 계산으로 돌아가기
        </button>` : ''}
    </div>

    <div class="sec">메인 리프트 무게 수정</div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px">수정하면 서브 운동 추천 무게가 모두 다시 계산돼요</div>
      ${MAIN_LIFTS.map(l=>`
        <div style="margin-bottom:12px">
          <div class="inp-label">${l.icon} ${l.name}</div>
          <div style="position:relative">
            <input type="number" class="inp" value="${ST.settings.prevWeights?.[l.id]||''}"
              placeholder="미입력" min="0" step="2.5" style="padding-right:46px"
              onchange="updPW('${l.id}',this.value)">
            <span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px">kg</span>
          </div>
        </div>`).join('')}
    </div>

    <div class="sec">운동 로테이션 현황</div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">서브 운동은 세션마다 자동으로 바뀝니다</div>
      ${Object.values(WO).map(wo => {
        const cnt = ST.settings.sessionCounts?.[wo.id] || 0;
        const exList = getWorkoutExercises(wo.id);
        const poolSlots = wo.ex.filter(s => s.pool);
        return `
          <div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
            <div style="font-size:13px;font-weight:700;margin-bottom:6px">${wo.icon} ${wo.name} <span style="color:var(--muted);font-size:11px;font-weight:400">#${cnt+1}회차</span></div>
            ${poolSlots.map((slot, si) => {
              const resolvedEx = exList[wo.ex.indexOf(slot)];
              return `<div style="font-size:12px;color:var(--muted);margin-top:3px">↻ ${resolvedEx?.name || ''}</div>`;
            }).join('')}
          </div>`;
      }).join('')}
    </div>

    <div class="sec">초기화</div>
    <div style="margin:0 14px 14px">
      <button class="btn btn-danger" onclick="resetApp()">⚠️ 앱 초기화 (모든 데이터 삭제)</button>
    </div>`;
}

function setPhase(p) {
  ST.settings.manualPhase = p;
  saveST();
  renderSettings();
}

function updPW(id, val) {
  if (!ST.settings.prevWeights) ST.settings.prevWeights = {};
  const v = parseFloat(val);
  if (v > 0) ST.settings.prevWeights[id] = v; else delete ST.settings.prevWeights[id];
  saveST();
}

async function resetApp() {
  if (!confirm('모든 기록과 설정이 삭제됩니다. 정말 초기화할까요?')) return;
  await wipeAll();
  localStorage.removeItem('gb_s');
  localStorage.removeItem('gb_h');
  ST.settings = null; ST.history = []; ST.step = 1;
  renderSetup();
}

// ─── INIT ─────────────────────────────────────────────────────────
function showLoading() {
  const b = document.getElementById('setup-body');
  if (b) b.innerHTML = `
    <div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:13px">
      <div style="font-size:32px;margin-bottom:8px">⏳</div>
      불러오는 중...
    </div>`;
}

(async () => {
  showLoading();
  await load();
  if (ST.settings) go('today');
  else { ST.step = 1; renderSetup(); }
})();
</script>
</body>
</html>
